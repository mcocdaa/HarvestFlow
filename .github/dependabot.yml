version: 2
updates:
  # uv
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
  # npm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # 成对主版本必须一起升级（否则出现 react 18 + react-dom 19 之类不兼容组合）
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: ['major']
      vite:
        patterns: ['vite', '@vitejs/plugin-react']
        update-types: ['major']
      vitest:
        patterns: ['vitest', '@vitest/coverage-v8']
        update-types: ['major']
    ignore:
      # antd 6：等 @ant-design/pro-components 支持（当前 2.8.10 peer 仅 antd ^4 || ^5）
      - dependency-name: 'antd'
        update-types: ['version-update:semver-major']
      # TypeScript 7：等 typescript-eslint 支持（当前 8.70.0 peer 不含 TS 7）
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
  # github-actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
  # Docker 基础镜像（monthly，安全更新不支持）
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
  # gitsubmodule
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(submodule)'
