version: 2
updates:
  # uv
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
  # npm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # antd 6：等 @ant-design/pro-components 支持（当前 2.8.10 peer 仅 antd ^4 || ^5）
      - dependency-name: 'antd'
        update-types: ['version-update:semver-major']
      # TypeScript 7：等 typescript-eslint 支持（当前 8.70.0 peer 不含 TS 7）
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
  # github-actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
  # Docker 基础镜像（monthly，安全更新不支持）
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: 'python'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: 'python'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'node'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
  # gitsubmodule
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 6 1 * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(submodule)'
